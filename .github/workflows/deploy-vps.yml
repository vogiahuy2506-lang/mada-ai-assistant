# ===========================================
# CI/CD Pipeline - Deploy to VPS (Direct deploy, no Docker image needed)
# ===========================================
name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - cleanup

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================
  # Build - just verify code compiles
  # ===========================================
  build:
    name: Verify Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.action != 'cleanup'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build server
        run: npm run build:server || true

      - name: Build frontend
        run: npm run build:client || npx vite build || true

  # ===========================================
  # Deploy - git clone + npm install + pm2
  # ===========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.action != 'cleanup'
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="/app/mada-ai-assistant"
            TEMP_DIR="/tmp/mada-deploy-temp"
            MIN_DISK_GB=2

            echo "=== Pre-deploy disk check ==="
            FREE_GB=$(df -BG / | tail -1 | awk '{print $4}' | tr -d 'G')
            echo "Disk free: ${FREE_GB}GB (min: ${MIN_DISK_GB}GB)"
            if [ "$FREE_GB" -lt "$MIN_DISK_GB" ]; then
              echo "Low disk, cleaning..."
              sudo docker system prune -af 2>/dev/null || true
              sudo journalctl --vacuum-size=50M 2>/dev/null || true
              sudo apt-get clean 2>/dev/null || true
            fi

            # Backup existing .env
            HAS_EXISTING_ENV=false
            if [ -d "$APP_DIR" ] && [ -f "$APP_DIR/.env" ]; then
              echo "Backing up existing .env..."
              sudo cp $APP_DIR/.env /tmp/mada-env-backup.env
              HAS_EXISTING_ENV=true
            fi

            # Stop existing PM2 process
            echo "=== Stopping existing PM2 process ==="
            cd $APP_DIR 2>/dev/null || true
            PM2_BIN=$(which pm2 2>/dev/null || echo "")
            if [ -n "$PM2_BIN" ]; then
              $PM2_BIN stop mada-app 2>/dev/null || true
              $PM2_BIN delete mada-app 2>/dev/null || true
            fi

            # Stop Docker containers if running
            echo "=== Stopping Docker containers ==="
            sudo docker compose down --remove-orphans 2>/dev/null || true
            sudo docker rm -f mada-app mada-nginx mada-ai-assistant-app-1 mada-ai-assistant-nginx-1 2>/dev/null || true
            sudo docker network rm mada-ai-assistant_default 2>/dev/null || true

            # Clean up temp directory
            echo "=== Cleaning up temp directory ==="
            sudo rm -rf $TEMP_DIR

            # Clone repository to temp directory
            echo "=== Cloning repository ==="
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vogiahuy2506-lang/mada-ai-assistant.git $TEMP_DIR

            if [ ! -d "$TEMP_DIR/.git" ]; then
              echo "Clone failed - .git not found in temp directory"
              exit 1
            fi

            # Move to app directory
            echo "=== Moving to app directory ==="
            sudo rm -rf $APP_DIR
            sudo mv $TEMP_DIR $APP_DIR

            # Configure environment
            echo "=== Configuring environment ==="
            {
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
              echo "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}"
              echo "PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}"
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
              echo "SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}"
              echo "SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}"
              echo "VECTOR_DB_PROVIDER=pinecone"
              echo "PINECONE_ENVIRONMENT=us-east-1"
              echo "NODE_ENV=production"
              echo "PORT=3000"
            } | sudo tee $APP_DIR/.env > /dev/null

            # Merge backup env vars (keep custom settings)
            if [ "$HAS_EXISTING_ENV" = "true" ]; then
              echo "Merging backup env vars..."
              grep -v -E '^(GEMINI_API_KEY|PINECONE_API_KEY|PINECONE_INDEX_NAME|JWT_SECRET|ADMIN_EMAIL|ADMIN_PASSWORD|SUPER_ADMIN_EMAIL|SUPER_ADMIN_PASSWORD)=' /tmp/mada-env-backup.env | sudo tee -a $APP_DIR/.env > /dev/null
            fi

            # Set permissions
            echo "=== Setting permissions ==="
            sudo chmod -R 755 $APP_DIR

            # Setup Node.js environment (handle nvm or direct install)
            echo "=== Setting up Node.js ==="
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              echo "Sourcing nvm..."
              [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
              . "$NVM_DIR/nvm.sh"
            fi
            
            # Also check common node locations
            if ! command -v node &> /dev/null; then
              echo "Node not found in PATH, checking common locations..."
              if [ -f /usr/local/bin/node ]; then
                export PATH="/usr/local/bin:$PATH"
              elif [ -f /usr/bin/node ]; then
                export PATH="/usr/bin:$PATH"
              fi
            fi
            
            # Verify node/npm is available
            if ! command -v npm &> /dev/null; then
              echo "npm not found, installing Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
              export PATH="/usr/bin:$PATH"
            fi
            
            echo "Node version: $(node --version)"
            echo "NPM version: $(npm --version)"
            
            # Get full path to npm
            NPM_BIN=$(which npm)
            NODE_BIN=$(which node)
            echo "NPM path: $NPM_BIN"
            echo "NODE path: $NODE_BIN"

            # Install dependencies
            echo "=== Installing dependencies ==="
            cd $APP_DIR
            $NPM_BIN install --omit=dev --legacy-peer-deps

            # Build application
            echo "=== Building application ==="
            $NPM_BIN run build:server
            $NPM_BIN run build:client || $NPM_BIN exec vite build

            # Start with PM2
            echo "=== Starting with PM2 ==="
            cd $APP_DIR
            
            # Check if PM2 is installed
            PM2_BIN=$(which pm2 2>/dev/null || echo "")
            if [ -z "$PM2_BIN" ]; then
              echo "Installing PM2..."
              $NPM_BIN install -g pm2
              PM2_BIN="$NODE_BIN/node_modules/pm2/bin/pm2"
              # Try common locations
              if [ ! -f "$PM2_BIN" ]; then
                PM2_BIN=$(find /usr -name "pm2" -type f 2>/dev/null | head -1)
              fi
              if [ ! -f "$PM2_BIN" ]; then
                PM2_BIN=$(find /home -name "pm2" -type f 2>/dev/null | head -1)
              fi
              if [ -z "$PM2_BIN" ] || [ ! -f "$PM2_BIN" ]; then
                echo "ERROR: Could not find PM2 after install"
                exit 1
              fi
              echo "PM2 found at: $PM2_BIN"
            fi
            
            # Start the application
            $PM2_BIN start dist/server.mjs --name mada-app -- --port 3000
            
            # Save PM2 config
            $PM2_BIN save
            
            # Setup startup script
            $PM2_BIN startup 2>/dev/null || true

            echo "=== Waiting for app to be healthy (max 120s) ==="
            COUNTER=0
            HEALTHY=false
            while [ $COUNTER -lt 24 ]; do
              COUNTER=$((COUNTER + 1))
              sleep 5
              HEALTH_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health 2>/dev/null || echo "000")
              if [ "$HEALTH_CODE" = "200" ]; then
                echo "✅ App is healthy! (took ${COUNTER}x5s=$((COUNTER * 5))s)"
                HEALTHY=true
                break
              fi
              if [ $((COUNTER % 4)) -eq 0 ]; then
                echo "  Waiting... (${COUNTER}/24) HTTP $HEALTH_CODE"
              fi
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "❌ App did not become healthy within 120s"
              echo "=== PM2 logs ==="
              $PM2_BIN logs mada-app --nostream --lines 50 2>/dev/null || true
              echo "=== PM2 status ==="
              $PM2_BIN status 2>/dev/null || true
              exit 1
            fi

            echo "✅ Deploy completed successfully at $(date)"
            echo "📝 Commit: ${{ github.sha }}"

      - name: Success Summary
        if: success()
        run: |
          echo "🚀 MADA AI Assistant deployed to ${{ secrets.VPS_HOST }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🔗 App: http://${{ secrets.VPS_HOST }}:3000"

      - name: Failure Summary
        if: failure()
        run: |
          echo "❌ Deploy failed!"
          echo "Check SSH logs above for details."

  cleanup:
    name: Cleanup Seed Data
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup'
    environment: production
    steps:
      - name: Delete seed questions from production DB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "Finding app directory..."
            APP_DIR="/app/mada-ai-assistant"
            
            if [ -f "$APP_DIR/data/mada.db" ]; then
              echo "Checking row counts before delete..."
              sqlite3 $APP_DIR/data/mada.db 'SELECT COUNT(*) as total FROM suggested_questions;'
              
              echo "Deleting seed questions..."
              sqlite3 $APP_DIR/data/mada.db "DELETE FROM suggested_questions WHERE id LIKE 'sq_%';"
              
              echo "Verifying after delete..."
              sqlite3 $APP_DIR/data/mada.db 'SELECT COUNT(*) as remaining FROM suggested_questions;'
            else
              echo "Database not found at $APP_DIR/data/mada.db"
              echo "Trying PM2..."
              sudo -u ${{ secrets.VPS_USER }} pm2 list
            fi
            
            echo "✅ Cleanup complete!"
