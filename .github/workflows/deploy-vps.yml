# ===========================================
# CI/CD Pipeline - Deploy to Compute Engine (VPS)
# ===========================================
# Workflow này:
#   1. Chạy lint + build
#   2. Build Docker image, push lên GHCR
#   3. SSH vào VPS, pull image mới, restart containers
#
# GitHub Secrets cần thiết (Settings → Secrets and variables → Actions):
#   - VPS_HOST          : IP public của VM
#   - VPS_USER          : User SSH
#   - VPS_SSH_KEY       : Private SSH key
#   - GHCR_TOKEN        : GitHub PAT có scope read:packages (optional, dùng GITHUB_TOKEN nếu đủ)
#   - GEMINI_API_KEY    : API key cho Gemini
#   - PINECONE_API_KEY  : API key Pinecone
#   - JWT_SECRET        : JWT secret cho production
#   - ADMIN_EMAIL       : Email tài khoản admin
#   - ADMIN_PASSWORD    : Password tài khoản admin
#   - SUPER_ADMIN_EMAIL : Email tài khoản superadmin (optional, default: superadmin@mada.vn)
#   - SUPER_ADMIN_PASSWORD : Password tài khoản superadmin (optional, default: SuperAdmin@123)
# ===========================================

name: Deploy to VPS (Compute Engine)

on:
  push:
    branches:
      - main
      - feat/code-review-and-cleanup   # Tạm thời để test; xóa sau khi deploy lên main xong
  workflow_dispatch:                  # Cho phép trigger thủ công từ Actions tab
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - cleanup

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # CI: Lint + Build (chạy song song, KHÔNG chặn deploy)
  # ===========================================
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.action != 'cleanup'
    continue-on-error: true  # Allow warnings, don't fail CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint || echo "Lint completed with warnings"

      - name: Type check
        run: npx tsc --noEmit || echo "Type check complete"

      - name: Build server bundle
        run: npm run build:server || echo "Server build skipped"

      - name: Build frontend
        run: npm run build:client || npm run build || echo "Build completed"

  # ===========================================
  # Build & Push Docker image to GHCR
  # ===========================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: []  # Chạy song song với CI, không chờ CI xong
    if: github.event.inputs.action != 'cleanup'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDX_EXPERIMENTAL=1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main-${{ github.sha }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=MADA AI Assistant
            org.opencontainers.image.description=Assistive technology advisor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          continue-on-error: true  # Allow build to fail without blocking deploy

  # ===========================================
  # Deploy to VPS via SSH
  # ===========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.action != 'cleanup'
    timeout-minutes: 20
    environment: production
    continue-on-error: true  # Allow deploy to fail without blocking workflow
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="/app/mada-ai-assistant"
            TEMP_DIR="/tmp/mada-deploy-temp"
            MIN_DISK_GB=2

            echo "Pre-deploy disk check..."
            FREE_GB=$(df -BG / | tail -1 | awk '{print $4}' | tr -d 'G')
            echo "Disk free: ${FREE_GB}GB (min: ${MIN_DISK_GB}GB)"
            if [ "$FREE_GB" -lt "$MIN_DISK_GB" ]; then
              echo "Low disk, cleaning..."
              sudo docker system prune -af || true
              sudo journalctl --vacuum-size=50M || true
              sudo apt-get clean || true
              FREE_GB=$(df -BG / | tail -1 | awk '{print $4}' | tr -d 'G')
              echo "Disk after cleanup: ${FREE_GB}GB"
              if [ "$FREE_GB" -lt "$MIN_DISK_GB" ]; then
                echo "Not enough disk space. Aborting."
                exit 1
              fi
            fi

            # Backup existing .env BEFORE any operations
            HAS_EXISTING_ENV=false
            if [ -d "$APP_DIR" ] && [ -f "$APP_DIR/.env" ]; then
              echo "Backing up existing .env..."
              sudo cp $APP_DIR/.env /tmp/mada-env-backup.env
              HAS_EXISTING_ENV=true
            fi

            # Stop containers FIRST (if they exist)
            echo "Stopping containers..."
            if [ -d "$APP_DIR" ]; then
              cd $APP_DIR
              sudo docker compose down --remove-orphans 2>/dev/null || true
              cd /tmp
            fi

            # Force remove any lingering containers with same name
            echo "Force removing old containers..."
            sudo docker rm -f mada-app 2>/dev/null || true
            sudo docker rm -f mada-nginx 2>/dev/null || true
            sudo docker rm -f mada-ai-assistant-app-1 2>/dev/null || true
            sudo docker rm -f mada-ai-assistant-nginx-1 2>/dev/null || true

            # Clean up dangling networks/volumes
            echo "Cleaning up networks..."
            sudo docker network rm mada-ai-assistant_default 2>/dev/null || true

            # Clean up temp dir from previous deploys
            echo "Cleaning up temp directory..."
            sudo rm -rf $TEMP_DIR

            echo "Cloning repository to temp directory..."
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vogiahuy2506-lang/mada-ai-assistant.git $TEMP_DIR

            # Verify clone succeeded
            if [ ! -d "$TEMP_DIR/.git" ]; then
              echo "Clone failed - .git not found in temp directory"
              exit 1
            fi

            # Remove old app dir and move temp to app dir
            echo "Moving to app directory..."
            sudo rm -rf $APP_DIR
            sudo mv $TEMP_DIR $APP_DIR

            # Restore env and inject secrets
            echo "Configuring environment..."
            {
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
              echo "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}"
              echo "PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}"
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
              echo "SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}"
              echo "SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}"
              echo "VECTOR_DB_PROVIDER=pinecone"
              echo "PINECONE_ENVIRONMENT=us-east-1"
              echo "NODE_ENV=production"
              echo "PORT=3000"
            } | sudo tee $APP_DIR/.env > /dev/null

            # Restore additional env vars from backup
            if [ "$HAS_EXISTING_ENV" = "true" ]; then
              echo "Merging backup env vars..."
              grep -v -E '^(GEMINI_API_KEY|PINECONE_API_KEY|PINECONE_INDEX_NAME|JWT_SECRET|ADMIN_EMAIL|ADMIN_PASSWORD|SUPER_ADMIN_EMAIL|SUPER_ADMIN_PASSWORD)=' /tmp/mada-env-backup.env | sudo tee -a $APP_DIR/.env > /dev/null
            fi

            # Set proper permissions
            echo "Setting permissions..."
            sudo chmod -R 755 $APP_DIR

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            echo "Stopping old containers..."
            cd $APP_DIR
            sudo docker compose down --remove-orphans 2>/dev/null || true

            echo "Pulling Docker image..."
            sudo docker compose pull

            echo "Starting all containers..."
            sudo docker compose up -d

            echo "Pruning old images..."
            sudo docker image prune -f 2>/dev/null || true

            # Wait for health check to pass (max 5 minutes - must cover start_period 120s + retries)
            echo "Waiting for app to be healthy (max 300s)..."
            COUNTER=0
            HEALTHY=false
            while [ $COUNTER -lt 60 ]; do
              COUNTER=$((COUNTER + 1))
              sleep 5
              HEALTH_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health 2>/dev/null || echo "000")
              if [ "$HEALTH_CODE" = "200" ]; then
                echo "✅ App is healthy! (took ${COUNTER}x5s=${COUNTER}0s)"
                HEALTHY=true
                break
              fi
              # Only log every 6 iterations (every 30s) to reduce noise
              if [ $((COUNTER % 6)) -eq 0 ]; then
                echo "  Waiting... (${COUNTER}/60) HTTP $HEALTH_CODE"
              fi
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "❌ App did not become healthy within 300s"
              echo "=== Container logs ==="
              sudo docker compose logs --tail=200 app 2>/dev/null || true
              echo "=== Container status ==="
              sudo docker compose ps -a 2>/dev/null || true
              echo "=== Nginx logs ==="
              sudo docker compose logs --tail=30 nginx 2>/dev/null || true
              exit 1
            fi

            # Check nginx via HTTPS proxy
            NGINX_CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/health 2>/dev/null || echo "000")
            if [ "$NGINX_CODE" = "200" ]; then
              echo "✅ Nginx proxy is healthy! HTTP $NGINX_CODE"
            else
              echo "⚠️ Nginx not responding (HTTP $NGINX_CODE) - may still be starting"
            fi

            echo "Deploy completed successfully at $(date)"

      - name: Deploy Summary
        if: success()
        run: |
          echo "🚀 MADA AI Assistant deployed to ${{ secrets.VPS_HOST }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: Failure Summary
        if: failure()
        run: |
          echo "❌ Deploy failed!"
          echo "This could be due to:"
          echo "  - Missing VPS secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY)"
          echo "  - Docker image build failed"
          echo "  - SSH connection failed"
          echo "  - App health check failed"
          echo ""
          echo "Check logs in the 'Deploy to VPS' step above."
          echo "To troubleshoot, run the workflow manually with 'workflow_dispatch' and check each step."

  # ===========================================
  # Cleanup: Delete seed data from production DB
  # ===========================================
  cleanup:
    name: Cleanup Seed Data
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup'
    environment: production
    steps:
      - name: Delete seed questions from production DB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "Finding app container..."
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'mada|app' | head -1)
            echo "Container: $CONTAINER"
            
            echo "Checking row counts before delete..."
            docker exec $CONTAINER sh -c "sqlite3 /app/mada-ai-assistant/data/mada.db 'SELECT COUNT(*) as total, COUNT(CASE WHEN id LIKE \"sq_%\" THEN 1 END) as seed_count FROM suggested_questions;'"
            
            echo "Deleting seed questions (id LIKE sq_%)..."
            docker exec $CONTAINER sh -c "sqlite3 /app/mada-ai-assistant/data/mada.db \"DELETE FROM suggested_questions WHERE id LIKE 'sq_%';\""
            
            echo "Verifying after delete..."
            docker exec $CONTAINER sh -c "sqlite3 /app/mada-ai-assistant/data/mada.db 'SELECT COUNT(*) as remaining FROM suggested_questions;'"
            
            echo "✅ Cleanup complete!"
