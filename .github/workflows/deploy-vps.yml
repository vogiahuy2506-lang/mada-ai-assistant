# ===========================================
# CI/CD Pipeline - Deploy to VPS (Fixed Version)
# ===========================================
name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - cleanup

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================
  # Deploy - git clone + npm install + pm2 + nginx
  # ===========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'cleanup'
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SECURE: ${{ secrets.MAIL_SECURE }}
          MAIL_TLS: ${{ secrets.MAIL_TLS }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          CONSULTATION_EMAIL: ${{ secrets.CONSULTATION_EMAIL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          envs: GITHUB_TOKEN,BUILD_SHA,GEMINI_API_KEY,JWT_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,SUPER_ADMIN_EMAIL,SUPER_ADMIN_PASSWORD,MAIL_HOST,MAIL_PORT,MAIL_SECURE,MAIL_TLS,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,CONSULTATION_EMAIL,ADMIN_URL
          script_path: scripts/deploy-vps.sh

      - name: Success Summary
        if: success()
        run: |
          echo "🚀 MADA AI Assistant deployed successfully!"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🔗 HTTP: http://mada.digiso.vn"
          echo "🔗 HTTPS: https://mada.digiso.vn (may take a moment)"

      - name: Failure Summary
        if: failure()
        run: |
          echo "❌ Deploy failed!"
          echo "Check SSH logs above for details."
          echo ""
          echo "Common issues:"
          echo "1. Disk space - check and clean if needed"
          echo "2. Node.js not found - verify installation"
          echo "3. Build errors - check package.json and dependencies"
          echo "4. PM2 permission - verify npm global prefix"

  cleanup:
    name: Cleanup Seed Data
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup'
    environment: production
    steps:
      - name: Delete seed questions from production DB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "Finding app directory..."
            APP_DIR="/app/mada-ai-assistant"
            
            if [ -f "$APP_DIR/data/mada.db" ]; then
              echo "Checking row counts before delete..."
              sqlite3 $APP_DIR/data/mada.db 'SELECT COUNT(*) as total FROM suggested_questions;'
              
              echo "Deleting seed questions..."
              sqlite3 $APP_DIR/data/mada.db "DELETE FROM suggested_questions WHERE id LIKE 'sq_%';"
              
              echo "Verifying after delete..."
              sqlite3 $APP_DIR/data/mada.db 'SELECT COUNT(*) as remaining FROM suggested_questions;'
            else
              echo "Database not found at $APP_DIR/data/mada.db"
            fi
            
            echo "✅ Cleanup complete!"
