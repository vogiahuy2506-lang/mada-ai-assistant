# ===========================================
# TEMPORARY diagnostic: so sánh MAIL_PASSWORD secret vs giá trị trên VPS
# Chỉ in độ dài + sha256, KHÔNG in mật khẩu.
# ===========================================
name: Diagnostic - Secret Check

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'check'
        type: choice
        options:
          - check

jobs:
  check:
    name: Check Secret vs VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A. Secret as GitHub sees it
        run: |
          set -e
          echo "=== GitHub secret MAIL_PASSWORD (as interpolated by Actions) ==="
          echo "length   : ${#SECRET_PW}"
          echo "sha256   : $(printf '%s' "$SECRET_PW" | shasum -a 256 | cut -d' ' -f1)"
        env:
          SECRET_PW: ${{ secrets.MAIL_PASSWORD }}

      - name: B. Same secret passed through ssh-action envs
        uses: appleboy/ssh-action@v1.2.5
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          envs: MAIL_PASSWORD
          script: |
            echo "=== Secret delivered to VPS via envs mechanism ==="
            echo "length   : ${#MAIL_PASSWORD}"
            echo "sha256   : $(printf '%s' "$MAIL_PASSWORD" | shasum -a 256 | cut -d' ' -f1)"
            echo ""
            echo "=== Same secret written through the deploy .env pipeline ==="
            TMPENV=/tmp/__diag_env_test
            {
              echo "MAIL_PASSWORD=$MAIL_PASSWORD"
            } | tee $TMPENV > /dev/null
            PW=$(grep -E '^MAIL_PASSWORD=' $TMPENV | head -1 | cut -d '=' -f2-)
            echo "in-file len    : ${#PW}"
            echo "in-file sha256 : $(printf '%s' "$PW" | shasum -a 256 | cut -d' ' -f1)"
            rm -f $TMPENV
