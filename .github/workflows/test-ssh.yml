name: Test SSH Connection
on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "✅ SSH Connection OK!"
            echo "Hostname: $(hostname)"
            echo "User: $(whoami)"
            echo "Disk space:"
            df -h /
            echo "Docker status:"
            sudo docker ps --format "table {{.Names}}\t{{.Status}}" 2>/dev/null || echo "Docker not running"
