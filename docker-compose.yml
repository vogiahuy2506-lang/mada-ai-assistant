# ===========================================
# MADA AI Assistant - Docker Compose (VPS / Compute Engine)
# ===========================================
# Usage on VPS:
#   docker compose pull
#   docker compose up -d
#
# Image được pull từ GHCR (GitHub Container Registry) thông qua CI/CD
# Image name mặc định: ghcr.io/<GITHUB_USER>/mada-ai-assistant:latest
# Có thể override bằng biến MADA_IMAGE trong .env
# ===========================================

services:
  # Application - All-in-one (API + static frontend)
  app:
    image: ${MADA_IMAGE:-ghcr.io/vogiahuy2506-lang/mada-ai-assistant:latest}
    container_name: mada-app
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-east-1}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-mada-knowledge-base}
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-mock}
      - DATABASE_PATH=/app/data/mada.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mada.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@mada.vn}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-SuperAdmin@123}
    volumes:
      - mada-data:/app/data
      - mada-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mada-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - mada-certbot:/var/www/certbot:ro
      - mada-nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mada-data:
    driver: local
  mada-uploads:
    driver: local
  mada-certbot:
    driver: local
  mada-nginx-logs:
    driver: local

networks:
  default:
    driver: bridge
