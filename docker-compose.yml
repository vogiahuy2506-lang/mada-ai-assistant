# ===========================================
# MADA AI Assistant - Docker Compose (VPS / Compute Engine)
# ===========================================
# Usage on VPS:
#   docker compose pull
#   docker compose up -d
#
# Image được pull từ GHCR (GitHub Container Registry) thông qua CI/CD
# Image name mặc định: ghcr.io/<GITHUB_USER>/mada-ai-assistant:latest
# Có thể override bằng biến MADA_IMAGE trong .env
# ===========================================

services:
  # Application - All-in-one (API + static frontend)
  app:
    image: ${MADA_IMAGE:-ghcr.io/vogiahuy2506-lang/mada-ai-assistant:latest}
    container_name: mada-app
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-east-1}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-mada-knowledge-base}
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-mock}
      - DATABASE_PATH=/app/data/mada.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mada.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@mada.vn}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-SuperAdmin@123}
      # ===== Mail / SMTP (for consultation notifications) =====
      - MAIL_HOST=${MAIL_HOST:-mail.digiso.vn}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_SECURE=${MAIL_SECURE:-true}
      - MAIL_TLS=${MAIL_TLS:-true}
      - MAIL_USERNAME=${MAIL_USERNAME:-mada.noreply@digiso.vn}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-MADA AI <mada.noreply@digiso.vn>}
      - CONSULTATION_EMAIL=${CONSULTATION_EMAIL:-hotro.digibook@gmail.com}
      - ADMIN_URL=${ADMIN_URL:-https://mada.digiso.vn}
    volumes:
      - mada-data:/app/data
      - mada-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=10 --tries=1 http://localhost:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  # NOTE: nginx starts immediately (no health condition) to avoid
  # "dependency failed" errors. Nginx returns 502/504 until app is ready,
  # then proxies correctly. The CI/CD script polls /api/health directly
  # on port 3000 to verify app readiness.
  nginx:
    image: nginx:alpine
    container_name: mada-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - mada-certbot:/var/www/certbot:ro
      - mada-nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mada-data:
    driver: local
  mada-uploads:
    driver: local
  mada-certbot:
    driver: local
  mada-nginx-logs:
    driver: local

networks:
  default:
    driver: bridge
