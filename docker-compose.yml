# ===========================================
# MADA AI Assistant - Docker Compose
# ===========================================
# Single-container deployment: Express serves API + static frontend
# Usage: docker-compose up -d
# ===========================================

services:
  # Application - All-in-one (API + static frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mada-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-east-1}
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-mock}
      - DATABASE_PATH=/app/data/mada.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

networks:
  default:
    driver: bridge
