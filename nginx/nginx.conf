# MADA AI - Nginx Configuration
# Hỗ trợ cả HTTP (port 80) và HTTPS (port 443 với Let's Encrypt)

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;

    # Security headers (áp dụng chung)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream
    upstream mada_backend {
        server app:3000;
        keepalive 32;
    }

    # ===========================================
    # HTTP server (port 80) - redirect to HTTPS nếu có cert
    # ===========================================
    server {
        listen 80;
        server_name _;

        # ACME challenge cho Let's Encrypt (nếu dùng certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint qua HTTP (cho monitoring)
        location /health {
            proxy_pass http://mada_backend/api/health;
            access_log off;
        }

        # Nếu đã có SSL cert thì redirect sang HTTPS
        # Nếu chưa có cert thì serve trực tiếp trên HTTP
        location / {
            # Check cert tồn tại không
            set $redirect_https "no";
            if ($scheme = "http") {
                set $redirect_https "yes";
            }

            # Nếu muốn force HTTPS, comment block dưới và uncomment redirect
            # if ($redirect_https = "yes") {
            #     return 301 https://$host$request_uri;
            # }

            # Tạm thời serve trực tiếp (chưa có cert)
            root /app/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API proxy qua HTTP (khi chưa có HTTPS)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://mada_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===========================================
    # HTTPS server (port 443) - chỉ active khi có SSL cert
    # ===========================================
    # Để enable HTTPS:
    #   1. Chạy certbot certonly --standalone -d your-domain.com
    #   2. Copy cert vào nginx/certs/fullchain.pem và nginx/certs/privkey.pem
    #   3. Uncomment block server bên dưới
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     root /app/dist;
    #     index index.html;
    #
    #     # SPA fallback
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    #
    #     # API proxy
    #     location /api/ {
    #         limit_req zone=api_limit burst=20 nodelay;
    #
    #         proxy_pass http://mada_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection 'upgrade';
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_cache_bypass $http_upgrade;
    #
    #         proxy_connect_timeout 60s;
    #         proxy_send_timeout 60s;
    #         proxy_read_timeout 60s;
    #     }
    #
    #     # WebSocket support
    #     location /ws {
    #         proxy_pass http://mada_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_set_header Host $host;
    #     }
    #
