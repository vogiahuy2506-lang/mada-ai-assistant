# ===========================================
# Nginx config cho HOST nginx + PM2 (deploy-vps.yml)
# ===========================================
# ⚠️ App chạy trên HOST ở PORT=3001 (PM2, process "mada-app").
#    → proxy_pass phải là localhost:3001.
#
# Nếu chạy bằng DOCKER COMPOSE, dùng nginx/nginx.docker.conf thay thế
# (trong container, "localhost" là chính nginx → phải proxy tới service "app").
#
# LƯU Ý: đổi port ở đây phải đổi PORT trong .github/workflows/deploy-vps.yml cho
# khớp. Lệch → nginx trỏ nhầm app, deploy vẫn báo "success" nhưng production
# phục vụ code/data cũ (đã xảy ra: PM2 3000 vs nginx 3001).

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name mada.digiso.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Whitelist health check so deploy script (and ops monitoring) can
        # probe without dealing with SSL certificates.
        location = /api/health {
            proxy_pass http://localhost:3001/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name mada.digiso.vn;

        ssl_certificate /etc/letsencrypt/live/mada.digiso.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mada.digiso.vn/privkey.pem;
        
        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        client_max_body_size 10M;

        location /api/ {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location = /api/health {
            proxy_pass http://localhost:3001/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location /ws {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
