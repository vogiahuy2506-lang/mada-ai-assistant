# ===========================================
# Nginx config cho DOCKER COMPOSE (container nginx)
# ===========================================
# ⚠️ KHÁC với nginx/nginx.conf (dùng cho host nginx + PM2):
#
#   nginx/nginx.conf        → proxy_pass http://localhost:3001  (app chạy trên HOST)
#   nginx/nginx.docker.conf → proxy_pass http://app:3000        (app chạy trong container)
#
# Trong container, "localhost" là chính container nginx — không phải app.
# Dùng chung file sẽ khiến nginx trong container proxy vào chính nó → 502.
#
# Port bên trong container vẫn là 3000 (Dockerfile ENV PORT=3000).

upstream mada_app {
    server app:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name mada.digiso.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/health {
        proxy_pass http://mada_app/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mada.digiso.vn;

    ssl_certificate /etc/letsencrypt/live/mada.digiso.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mada.digiso.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://mada_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/health {
        proxy_pass http://mada_app/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ws {
        proxy_pass http://mada_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://mada_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
